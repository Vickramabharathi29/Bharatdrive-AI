[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatdrive-ai"
version = "2.5.0"
description = "Adaptive Path Planning and Dynamic Collision Avoidance for Autonomous Vehicles on Unstructured Indian Roads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "BharatDrive-AI Engineering Team", email = "dev@bharatdrive.ai"}
]
keywords = [
    "autonomous-driving",
    "frenet-planning",
    "hybrid-astar",
    "indian-roads",
    "risk-assessment",
    "matlab-simulink",
    "co-simulation",
    "stanley-controller",
    "motion-planning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.8.0",
    "opencv-python-headless>=4.8.0",
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "app.py:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
